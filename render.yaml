services:
  - type: web
    name: ajaia-docs
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: ajaia-docs-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data